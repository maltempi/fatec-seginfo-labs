<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>CRM — Loja A</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:0 20px}
.card{border:1px solid #ccc;border-radius:10px;padding:18px;margin:14px 0}
button{padding:10px 14px;margin:5px 5px 5px 0;cursor:pointer}
code,pre{background:#f4f4f4;padding:3px 6px;border-radius:4px}
pre{padding:12px;white-space:pre-wrap}
.note{color:#555}
</style>
</head>
<body>
<h1>CRM — Loja A</h1>
<p>Domínio: <code>crm.loja-a.test</code></p>

<div class="card">
  <h2>Cookies recebidos</h2>
  <pre id="cookies"></pre>
  <p class="note">
    O CRM consegue receber <code>cliente</code> porque ele possui
    <code>Domain=loja-a.test</code>. O cookie <code>produto</code> é
    exclusivo de <code>ecommerce.loja-a.test</code>.
  </p>
</div>

<div class="card">
  <h2>Atividades</h2>
  <button>Comprar de novo</button>
  <button>Devolver produto</button>
  <button>Alterar cadastro</button>
  <button data-destino="ecommerce">Abrir e-commerce em outra aba</button>
  <button data-destino="parceiro">Abrir parceiro em outra aba</button>
</div>
<iframe id="analyticsFrame" src="http://analytics.terceiro.test:3002/" style="display:none" title="Analytics"></iframe>
<script>
const analytics = document.getElementById('analyticsFrame');
const ANALYTICS_ORIGIN = 'http://analytics.terceiro.test:3002';

document.addEventListener('click', function(event){
  const alvo = event.target.closest('button');
  if (!alvo) return;

  analytics.contentWindow.postMessage({
    tipo: 'tracking',
    acao: 'clicou em "' + alvo.textContent.trim() + '"',
    pagina: location.pathname,
    titulo: document.title,
    quando: new Date().toISOString()
  }, ANALYTICS_ORIGIN);

  const destino = alvo.dataset.destino;
  if (destino) {
    const urls = {
      ecommerce: 'http://ecommerce.loja-a.test:3000/',
      parceiro: 'http://ecommerce.parceiro.test:3003/'
    };
    window.open(urls[destino], '_blank');
  }
});

analytics.addEventListener('load', () => {
  analytics.contentWindow.postMessage({
    tipo: 'tracking',
    acao: 'abriu o CRM',
    pagina: location.pathname,
    titulo: document.title,
    quando: new Date().toISOString()
  }, ANALYTICS_ORIGIN);
});

document.getElementById('cookies').textContent =
  document.cookie || '(nenhum cookie visível)';
</script>
</body>
</html>
